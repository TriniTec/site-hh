[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Endereços limpos: /a-jornada e /sobre (o Netlify serve a-jornada.html nesses caminhos).
# leituraenergetica.com.br redireciona (301) para o domínio principal, mantendo o caminho.
# Funciona quando o domínio estiver adicionado no Netlify como alias do site.
[[redirects]]
  from = "https://leituraenergetica.com.br/*"
  to = "https://harmonizacaohumana.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.leituraenergetica.com.br/*"
  to = "https://harmonizacaohumana.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
