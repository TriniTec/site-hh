name: Atualizar lives

# Uma vez por dia, às 8h de Brasília (11h UTC): lê a playlist das lives e, só se algo mudou (live nova, data, guia,
# miniatura trocada no YouTube), atualiza data/ e as miniaturas. A hora da live da semana (faixa "Ao vivo agora") ele
# lê só na segunda e na quinta; na quinta roda também às 17h, para pegar uma mudança de hora no dia da live.
# O commit faz o Netlify publicar o site de novo.
on:
  schedule:
    - cron: "7 11 * * *"
    - cron: "7 20 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/atualizar-lives.mjs
      - name: Publicar se mudou
        run: |
          if [ -n "$(git status --porcelain data src/img/lives src/img/guias)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data/lives.json data/episodios.json data/live-agendada.json src/img/lives src/img/guias
            git commit -m "Lives: atualiza as três mais recentes"
            git push
          else
            echo "Nada novo."
          fi
